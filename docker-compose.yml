services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kgrag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kgrag}
      POSTGRES_USER: ${POSTGRES_USER:-kgrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9u9BNwZttIrUDOtA9OhRQRDC00GpLN6x}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kgrag} -d ${POSTGRES_DB:-kgrag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kgrag-net

  neo4j:
    image: neo4j:5.26-community
    container_name: kgrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-eVCj08KwjoyjuTzL2FNz37mKEUonh5lw}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kgrag-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kgrag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - DATABASE_POSTGRES_HOST=postgres
      - DATABASE_POSTGRES_PORT=5432
      - DATABASE_NEO4J_URI=bolt://neo4j:7687
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - kgrag-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kgrag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - kgrag-net

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:

networks:
  kgrag-net:
    driver: bridge
