# System Settings for Knowledge Graph RAG (PRD §13)

llm:
  runtime: "openrouter"
  endpoint: "https://openrouter.ai/api/v1"
  model: "nvidia/nemotron-3.5-super-vl:free"
  temperature: 0.0
  timeout_seconds: 90.0
  max_retries: 2

embedding:
  runtime: "openrouter"
  endpoint: "https://openrouter.ai/api/v1"
  model: "nvidia/nemotron-3-embed-1b:free"
  dimension: 2048
  batch_size: 16

system_one:
  runtime: "openrouter"
  endpoint: "https://openrouter.ai/api/alpha/decisions"
  model: "inception/mercury-decide:free"
  timeout_seconds: 30.0

reranker:
  enabled: false
  model: "BAAI/bge-reranker-base"

versions:
  prompt_version: "v1.0"
  ontology_version: "v1.0"
  schema_version: "v1.0"
  chunker_version: "v1.0"
  extraction_version: "v1.0"

chunking:
  target_tokens: 700
  overlap_tokens: 100
  min_tokens: 100
  max_tokens: 900

extraction:
  confidence_floor: 0.5
  evidence_match_threshold: 0.85
  max_extraction_chunks: 800  # Default budget for CPU-only dev (§5.7)
  dry_run_sample_size: 20
  confirm_full_ingestion: true
  prefilter_loss_target: 0.05

resolution:
  exact_match_threshold: 1.0
  embedding_similarity_threshold: 0.85
  review_band_lower: 0.70
  review_band_upper: 0.85

router:
  confidence_threshold: 0.75
  fallback_route: "hybrid"

query:
  default_top_k: 8
  max_top_k: 20
  max_question_length: 500
  graph_path_timeout_seconds: 5.0
  graph_path_hard_limit: 50
  context_token_budget: 4000
  runtime_support_check: false

sec:
  user_agent_env: "SEC_USER_AGENT"
  rate_limit_per_second: 5.0
  raw_cache_dir: "data/raw"
  processed_dir: "data/processed"

database:
  postgres:
    host_env: "POSTGRES_HOST"
    port_env: "POSTGRES_PORT"
    database_env: "POSTGRES_DB"
    user_env: "POSTGRES_USER"
    password_env: "POSTGRES_PASSWORD"
    pool_size: 10
  neo4j:
    uri_env: "NEO4J_URI"
    user_env: "NEO4J_USER"
    password_env: "NEO4J_PASSWORD"

statistics:
  bootstrap_iterations: 2000
  random_seed: 42
  min_category_size_confirmatory: 15
