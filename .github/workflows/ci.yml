name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint & Format (Python / Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: pip install --upgrade ruff

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  lint-frontend:
    name: Lint Frontend (Oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kgrag_test
          POSTGRES_USER: kgrag
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test_password
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: kgrag_test
      POSTGRES_USER: kgrag
      POSTGRES_PASSWORD: test_password
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test_password
      DATABASE_POSTGRES_HOST: 127.0.0.1
      DATABASE_POSTGRES_PORT: 5432
      DATABASE_POSTGRES_DB: kgrag_test
      DATABASE_POSTGRES_USER: kgrag
      DATABASE_POSTGRES_PASSWORD: test_password
      DATABASE_NEO4J_URI: bolt://127.0.0.1:7687
      DATABASE_NEO4J_USER: neo4j
      DATABASE_NEO4J_PASSWORD: test_password
      OPENROUTER_API_KEY: mock_key_for_ci_pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize PostgreSQL Test Schema
        run: |
          python -c "from kgrag.db.postgres import init_schema; init_schema()"

      - name: Initialize Neo4j Test Constraints
        run: |
          python -c "from kgrag.db.neo4j import init_constraints; init_constraints()"

      - name: Run Pytest Unit Suites
        run: |
          pytest tests/unit -v --durations=10

  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  docker-build-verify:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kgrag-api:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: kgrag-frontend:ci-test
