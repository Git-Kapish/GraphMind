[project]
name = "kg-rag"
version = "0.1.0"
description = "Knowledge Graph RAG for Enterprise Data"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
    "neo4j>=5.18.0",
    "edgartools>=2.15.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "tenacity>=8.2.3",
    "tqdm>=4.66.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
